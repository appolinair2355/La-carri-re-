<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOSSOU KOUAMÉ - Gestion Multi-Niveaux</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#581c87 50%,#be185d 100%);min-height:100vh;margin:0;color:#1f2937}
.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);border-radius:1rem;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.glass-dark{background:rgba(17,24,39,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:1rem;box-shadow:0 8px 32px rgba(0,0,0,.3);color:#fff}
.inp{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.8);border:1px solid #e5e7eb;border-radius:.75rem;outline:none;transition:all .2s;font-size:.875rem}
.inp:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.tab{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:.75rem;font-weight:500;transition:all .2s;cursor:pointer;border:none;font-size:.875rem}
.tab-active{background:#4f46e5;color:#fff;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.tab-inactive{background:rgba(255,255,255,.6);color:#374151}
.tab-inactive:hover{background:rgba(255,255,255,.8)}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;background:#4f46e5;color:#fff;font-weight:600;border-radius:.75rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border:none;cursor:pointer;transition:all .2s;font-size:1rem;width:100%}
.btn-primary:hover{background:#4338ca;transform:scale(1.02)}
.btn-primary:active{transform:scale(.98)}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;background:rgba(255,255,255,.9);color:#4f46e5;font-weight:600;border-radius:.75rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border:1px solid rgba(79,70,229,.2);cursor:pointer;transition:all .2s;font-size:1rem;width:100%}
.btn-secondary:hover{background:#fff;transform:scale(1.02)}
.btn-secondary:active{transform:scale(.98)}
.btn-dark{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;background:#1f2937;color:#fff;font-weight:600;border-radius:.75rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border:none;cursor:pointer;transition:all .2s;font-size:1rem;width:100%}
.btn-dark:hover{background:#111827;transform:scale(1.02)}
.btn-dark:active{transform:scale(.98)}
.btn-small{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:#4f46e5;color:#fff;font-weight:600;border-radius:.5rem;border:none;cursor:pointer;transition:all .2s;font-size:.875rem}
.btn-small:hover{background:#4338ca}
.btn-green{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:#16a34a;color:#fff;font-weight:600;border-radius:.5rem;border:none;cursor:pointer;transition:all .2s;font-size:.875rem}
.btn-green:hover{background:#15803d}
.btn-red{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:#fee2e2;color:#dc2626;border-radius:.5rem;border:none;cursor:pointer;transition:all .2s;font-size:.875rem}
.btn-red:hover{background:#fecaca}
.msg-error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:1rem;border-radius:.75rem;font-size:.875rem;display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.msg-success{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:1rem;border-radius:.75rem;font-size:.875rem;display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.hidden{display:none}
select.inp{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
