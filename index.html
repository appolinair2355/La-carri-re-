<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOSSOU KOUAMÉ - Gestion Multi-Niveaux</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);min-height:100vh;margin:0;color:#1f2937;overflow-x:hidden}

/* ── BARRE DE CHARGEMENT ── */
#progress-bar{position:fixed;top:0;left:0;height:3px;width:0%;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899);z-index:9999;transition:width .3s ease;box-shadow:0 0 8px rgba(168,85,247,.8)}
#progress-bar.done{width:100%;opacity:0;transition:width .2s ease,opacity .3s ease .1s}

/* ── OVERLAY DE CHARGEMENT ── */
#loading-overlay{position:fixed;inset:0;background:rgba(15,12,41,.6);backdrop-filter:blur(4px);z-index:9998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loading-overlay.show{display:flex}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.2);border-top-color:#a855f7;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── GLASS CARDS ── */
.glass{background:rgba(255,255,255,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.4);border-radius:1.25rem;box-shadow:0 20px 60px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.05) inset}
.glass-dark{background:rgba(17,24,39,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:1.25rem;box-shadow:0 20px 60px rgba(0,0,0,.4);color:#fff}
.glass-purple{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(168,85,247,.15));backdrop-filter:blur(20px);border:1px solid rgba(168,85,247,.25);border-radius:1.25rem;box-shadow:0 8px 32px rgba(99,102,241,.2)}

/* ── INPUTS ── */
.inp{width:100%;padding:.8rem 1rem;background:rgba(249,250,251,1);border:1.5px solid #e5e7eb;border-radius:.875rem;outline:none;transition:all .25s;font-size:.9rem;color:#111827}
.inp:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.15);background:#fff}
select.inp{cursor:pointer}

/* ── TABS ── */
.tab{display:flex;align-items:center;gap:.5rem;padding:.6rem 1.1rem;border-radius:.875rem;font-weight:600;transition:all .25s;cursor:pointer;border:none;font-size:.8rem;letter-spacing:.01em}
.tab-active{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 15px rgba(79,70,229,.4)}
.tab-inactive{background:rgba(255,255,255,.7);color:#4b5563;border:1px solid rgba(0,0,0,.06)}
.tab-inactive:hover{background:rgba(255,255,255,.95);transform:translateY(-1px)}

/* ── PAGE ── */
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.page-anim{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ── BOUTONS ── */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.5rem;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;border-radius:.875rem;box-shadow:0 4px 15px rgba(79,70,229,.4);border:none;cursor:pointer;transition:all .25s;font-size:.95rem;width:100%;letter-spacing:.01em}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(79,70,229,.5)}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.5rem;background:rgba(255,255,255,.95);color:#4f46e5;font-weight:700;border-radius:.875rem;box-shadow:0 4px 15px rgba(0,0,0,.1);border:1.5px solid rgba(99,102,241,.25);cursor:pointer;transition:all .25s;font-size:.95rem;width:100%}
.btn-secondary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.2);border-color:rgba(99,102,241,.5)}
.btn-secondary:active{transform:translateY(0) scale(.98)}
.btn-dark{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.5rem;background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;font-weight:700;border-radius:.875rem;box-shadow:0 4px 15px rgba(0,0,0,.3);border:none;cursor:pointer;transition:all .25s;font-size:.95rem;width:100%}
.btn-dark:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.btn-dark:active{transform:translateY(0) scale(.98)}
.btn-small{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:600;border-radius:.625rem;border:none;cursor:pointer;transition:all .2s;font-size:.82rem}
.btn-small:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,.4)}
.btn-green{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-weight:600;border-radius:.625rem;border:none;cursor:pointer;transition:all .2s;font-size:.82rem}
.btn-green:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(22,163,74,.4)}
.btn-red{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;background:#fef2f2;color:#dc2626;border-radius:.625rem;border:1px solid #fecaca;cursor:pointer;transition:all .2s;font-size:.82rem}
.btn-red:hover{background:#fee2e2;transform:translateY(-1px)}

/* ── MESSAGES ── */
.msg-error{background:linear-gradient(135deg,#fef2f2,#fff5f5);border:1.5px solid #fca5a5;color:#b91c1c;padding:1rem 1.25rem;border-radius:.875rem;font-size:.875rem;display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;animation:fadeUp .2s ease}
.msg-success{background:linear-gradient(135deg,#f0fdf4,#f7fff9);border:1.5px solid #86efac;color:#15803d;padding:1rem 1.25rem;border-radius:.875rem;font-size:.875rem;display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;animation:fadeUp .2s ease}

/* ── BADGE ── */
.badge-pending{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:600;background:linear-gradient(135deg,#fef9c3,#fef3c7);color:#92400e;border:1px solid #fcd34d;animation:pulse-badge 2s ease infinite}
.badge-ok{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:600;background:linear-gradient(135deg,#dcfce7,#d1fae5);color:#166534;border:1px solid #86efac}
@keyframes pulse-badge{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.3)}50%{box-shadow:0 0 0 4px rgba(251,191,36,.1)}}

/* ── STAT CARDS ── */
.stat-card{padding:1.25rem;border-radius:1rem;text-align:center;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;inset:0;opacity:.07;background:radial-gradient(circle at 70% 30%,#fff,transparent 70%)}
.stat-indigo{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;box-shadow:0 8px 25px rgba(79,70,229,.35)}
.stat-purple{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 8px 25px rgba(124,58,237,.35)}
.stat-green{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 8px 25px rgba(22,163,74,.35)}
.stat-rose{background:linear-gradient(135deg,#e11d48,#f43f5e);color:#fff;box-shadow:0 8px 25px rgba(225,29,72,.35)}

/* ── CARD ITEMS ── */
.item-card{background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.07);border-radius:1rem;padding:1rem 1.25rem;transition:all .2s}
.item-card:hover{background:rgba(255,255,255,.95);box-shadow:0 4px 15px rgba(0,0,0,.08);transform:translateY(-1px)}
.pending-card{background:linear-gradient(135deg,rgba(254,243,199,.8),rgba(255,251,235,.9));border:1.5px solid #fcd34d;border-radius:1rem;padding:1rem 1.25rem}

/* ── HIDDEN ── */
.hidden{display:none}
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="color:rgba(255,255,255,.8);font-size:.875rem;font-weight:500">Chargement...</p>
</div>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
